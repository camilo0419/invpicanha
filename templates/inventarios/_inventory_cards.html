<div class="inventory-list">{% for inv in inventories %}<a class="inventory-card" href="{% url 'inventory_detail' inv.pk %}"><div><b>{{ inv.get_inventory_type_display }}</b><span>{{ inv.inventory_date|date:'d/m/Y' }} · {{ inv.created_by.username }}</span></div><div class="status {{ inv.state|lower }}">{{ inv.get_state_display }}</div><div class="mini-stats"><span>Crít. {{ inv.total_critical }}</span><span>Bajos {{ inv.total_low }}</span><span>Altos {{ inv.total_high }}</span></div></a>{% empty %}<div class="empty">Todavía no hay inventarios.</div>{% endfor %}</div>
